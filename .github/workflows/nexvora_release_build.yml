name: NexVora Terminal - Signed Release APK (manual)

# Manual workflow. Requires these repository secrets (never commit them):
#   NEXVORA_KEYSTORE_BASE64   base64 of your .jks/.keystore file
#   NEXVORA_KEYSTORE_PASSWORD keystore password
#   NEXVORA_KEY_ALIAS         key alias
#   NEXVORA_KEY_PASSWORD      key password
# Create the base64 value with:  base64 -w0 my-release.jks
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check signing secrets exist
        env:
          KS: ${{ secrets.NEXVORA_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.NEXVORA_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.NEXVORA_KEY_ALIAS }}
          KP: ${{ secrets.NEXVORA_KEY_PASSWORD }}
        run: |
          for v in KS KSP KA KP; do
            [ -n "${!v}" ] || { echo "Missing required secret for $v (see comments at top of this workflow)"; exit 1; }
          done

      - name: Install Android SDK platform and NDK pinned by gradle.properties
        shell: bash
        run: |
          set -euo pipefail
          prop() { grep -E "^$1=" gradle.properties | head -1 | cut -d= -f2- | tr -d '\r'; }
          NDK_VERSION="$(prop ndkVersion)"; COMPILE_SDK="$(prop compileSdkVersion)"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-$COMPILE_SDK" "ndk;$NDK_VERSION"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APKs
        shell: bash
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: ./gradlew assembleRelease

      - name: Sign APKs
        shell: bash
        env:
          KS: ${{ secrets.NEXVORA_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.NEXVORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXVORA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.NEXVORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          mkdir -p signed
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "No release APKs found in app/build/outputs/apk/release"; exit 1; }
          for apk in "${apks[@]}"; do
            out="signed/nexvora-terminal_$(basename "$apk" .apk)_signed.apk"
            "$BT/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "$out" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify "$out"
          done
          rm -f "$RUNNER_TEMP/release.jks"
          (cd signed && sha256sum *.apk > sha256sums)

      - name: Upload signed APKs
        uses: actions/upload-artifact@v7
        with:
          name: nexvora-terminal-signed-release
          path: signed/*
