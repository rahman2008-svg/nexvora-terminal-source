name: NexVora Terminal - Debug APK

on:
  push:
    branches:
      - main
      - master
      - 'github-releases/**'
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.package_variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [apt-android-7, apt-android-5]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          prop() { grep -E "^$1=" gradle.properties | head -1 | cut -d= -f2- | tr -d '\r'; }
          NDK_VERSION="$(prop ndkVersion)"
          COMPILE_SDK="$(prop compileSdkVersion)"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -n "$NDK_VERSION"
          test -n "$COMPILE_SDK"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-$COMPILE_SDK" "ndk;$NDK_VERSION"
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APKs
        shell: bash
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          set -euo pipefail

          VERSION_LINE="$(grep -m 1 'versionName "' app/build.gradle)"
          CURRENT_VERSION="$(printf '%s\n' "$VERSION_LINE" | sed -E 's/.*versionName "([^"]+)".*/\1/')"
          VERSION="${CURRENT_VERSION}+${GITHUB_SHA:0:7}"

          export TERMUX_APP_VERSION_NAME="$VERSION"
          export TERMUX_PACKAGE_VARIANT="$PACKAGE_VARIANT"

          ./gradlew --no-daemon assembleDebug

          APK_DIR="app/build/outputs/apk/debug"
          echo "APK_DIR=$APK_DIR" >> "$GITHUB_ENV"
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_VARIANT=$PACKAGE_VARIANT" >> "$GITHUB_ENV"

          echo "APK files generated:"
          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print

          for ABI in universal arm64-v8a armeabi-v7a x86_64 x86; do
            APK="$(find "$APK_DIR" -maxdepth 1 -type f -name "*-${ABI}.apk" -print -quit)"
            if [[ -z "$APK" ]]; then
              echo "Missing APK for ABI: $ABI"
              exit 1
            fi

            KEY="$(echo "$ABI" | tr '[:lower:]-' '[:upper:]_')"
            echo "APK_${KEY}=$APK" >> "$GITHUB_ENV"
          done

          (
            cd "$APK_DIR"
            sha256sum ./*.apk > SHA256SUMS.txt
          )

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          BADGING="$("$AAPT2" dump badging "$APK_UNIVERSAL")"
          echo "$BADGING" | head -5
          echo "$BADGING" | grep -Fq "package: name='com.termux'"
          echo "$BADGING" | grep -Fq "application-label:'NexVora Terminal'"
          echo "$BADGING" | grep -Fq "versionName='$APK_VERSION'"
          echo "APK identity verified."

      - name: Upload universal APK
        uses: actions/upload-artifact@v6
        with:
          name: NexVora-Terminal-${{ matrix.package_variant }}-universal
          path: ${{ env.APK_UNIVERSAL }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v6
        with:
          name: NexVora-Terminal-${{ matrix.package_variant }}-arm64-v8a
          path: ${{ env.APK_ARM64_V8A }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v6
        with:
          name: NexVora-Terminal-${{ matrix.package_variant }}-armeabi-v7a
          path: ${{ env.APK_ARMEABI_V7A }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v6
        with:
          name: NexVora-Terminal-${{ matrix.package_variant }}-x86_64
          path: ${{ env.APK_X86_64 }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 APK
        uses: actions/upload-artifact@v6
        with:
          name: NexVora-Terminal-${{ matrix.package_variant }}-x86
          path: ${{ env.APK_X86 }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload SHA-256 checksums
        uses: actions/upload-artifact@v6
        with:
          name: NexVora-Terminal-${{ matrix.package_variant }}-SHA256SUMS
          path: ${{ env.APK_DIR }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
